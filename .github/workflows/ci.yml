name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      MONGODB_URI_TEST: mongodb://127.0.0.1:27017/bizbuilder_ci
      JWT_SECRET: ci-test-jwt-secret-at-least-32-characters-long
      NODE_ENV: test
      PORT: 5000
      CORS_ORIGIN: http://localhost:5173
      QA_BASE_URL: http://localhost:5000/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Backend syntax check
        working-directory: backend
        run: npm run build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Phase 5 lifecycle QA
        working-directory: backend
        run: node scripts/phase5-qa.js

      - name: Start backend server
        working-directory: backend
        run: |
          MONGODB_URI="$MONGODB_URI_TEST" node server.js &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/api/health; then
              echo "Server ready"
              exit 0
            fi
            sleep 2
          done
          echo "Server failed to start"
          exit 1

      - name: Stage 2 settings QA
        working-directory: backend
        run: MONGODB_URI="$MONGODB_URI_TEST" node scripts/stage2-settings-qa.js

      - name: Stage 1 tenant isolation QA
        working-directory: backend
        run: MONGODB_URI="$MONGODB_URI_TEST" node scripts/stage1-tenant-qa.js
